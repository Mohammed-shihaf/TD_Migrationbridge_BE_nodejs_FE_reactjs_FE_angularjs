apiVersion: apps/v1
kind: Deployment
metadata:
  name: migrationbridge-backend
  labels:
    app: migrationbridge-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: migrationbridge-backend
  template:
    metadata:
      labels:
        app: migrationbridge-backend
    spec:
      containers:
        - name: migrationbridge-backend
          image: migrationbridge-backend:node20
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: migrationbridge-backend
spec:
  selector:
    app: migrationbridge-backend
  ports:
    - port: 80
      targetPort: 3000
